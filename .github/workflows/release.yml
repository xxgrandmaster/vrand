name: Build VRAND releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: vrand
            asset: vrand-linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: vrand
            asset: vrand-linux-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: vrand.exe
            asset: vrand-windows-x86_64.exe

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: vrand.exe
            asset: vrand-windows-aarch64.exe

          - os: macos-13
            target: x86_64-apple-darwin
            binary: vrand
            asset: vrand-macos-x86_64

          - os: macos-14
            target: aarch64-apple-darwin
            binary: vrand
            asset: vrand-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
               "release/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
               "release/${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true