name: Build VRAND releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # -------------------------
          # Linux x86_64
          # -------------------------
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: vrand
            asset: vrand-linux-x86_64

          # -------------------------
          # Linux ARM64
          # -------------------------
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: vrand
            asset: vrand-linux-aarch64
            cross: true

          # -------------------------
          # Windows x86_64
          # -------------------------
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: vrand.exe
            asset: vrand-windows-x86_64.exe

          # -------------------------
          # macOS x86_64
          # -------------------------
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary: vrand
            asset: vrand-macos-x86_64

          # -------------------------
          # macOS ARM64
          # -------------------------
          - name: macOS ARM64
            os: macos-14
            target: aarch64-apple-darwin
            binary: vrand
            asset: vrand-macos-aarch64

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Only needed for Linux ARM64 cross compilation.
      - name: Install ARM64 Linux toolchain
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release

          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "release/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
